<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style-login.css">
</head>
<body>
    
    <main class="login-container">
        <h2>Cadastro</h2>
        <form id="cadastro-form">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required minlength="3" maxlength="100" oninvalid="this.setCustomValidity('Por favor, insira um nome válido.')" oninput="this.setCustomValidity('')" placeholder="Digite seu nome (mínimo 3 caracteres)">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required oninvalid="this.setCustomValidity('Por favor, insira um email válido.')" oninput="this.setCustomValidity('') " placeholder="Digite seu email">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required minlength="7" oninvalid="this.setCustomValidity('A senha deve ter pelo menos 7 caracteres.')" oninput="this.setCustomValidity('') " placeholder="Digite sua senha (mínimo 7 caracteres)">

            <label for="confirmar-senha">Confirmar Senha:</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" required minlength="7" oninvalid="this.setCustomValidity('A senha deve ter pelo menos 7 caracteres.')" oninput="this.setCustomValidity('') " placeholder="Confirme sua senha">

            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
    </main>

    <script src="script-cadastro.js"></script>
</body>
</html>
